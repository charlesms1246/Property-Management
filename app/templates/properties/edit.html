{% extends "base.html" %}

{% block title %}Edit Property - {{ property.name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('properties.list_properties') }}">Properties</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('properties.view_property', property_id=property.id) }}">{{ property.name }}</a></li>
            <li class="breadcrumb-item active" aria-current="page">Edit</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Edit Property Details</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Property Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ property.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" name="address" value="{{ property.address }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="type" class="form-label">Property Type</label>
                            <select class="form-select" id="type" name="type" required>
                                <option value="apartment" {% if property.type == 'apartment' %}selected{% endif %}>Apartment</option>
                                <option value="house" {% if property.type == 'house' %}selected{% endif %}>House</option>
                                <option value="condo" {% if property.type == 'condo' %}selected{% endif %}>Condo</option>
                                <option value="townhouse" {% if property.type == 'townhouse' %}selected{% endif %}>Townhouse</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="vacant" {% if property.status == 'vacant' %}selected{% endif %}>Vacant</option>
                                <option value="occupied" {% if property.status == 'occupied' %}selected{% endif %}>Occupied</option>
                                <option value="maintenance" {% if property.status == 'maintenance' %}selected{% endif %}>Under Maintenance</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="rent_amount" class="form-label">Monthly Rent Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="rent_amount" name="rent_amount" 
                                       value="{{ property.rent_amount }}" step="0.01" min="0" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <a href="{{ url_for('properties.view_property', property_id=property.id) }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
