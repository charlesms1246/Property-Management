{% extends "base.html" %}

{% block title %}Add Tenant - Property Management{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title mb-0">Add New Tenant</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Tenant Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" name="phone" required>
                        </div>
                        <div class="mb-3">
                            <label for="property_id" class="form-label">Property</label>
                            <select class="form-select" id="property_id" name="property_id" required>
                                <option value="">Select a property</option>
                                {% for property in properties %}
                                <option value="{{ property.id }}">
                                    {{ property.name }} - {{ property.address }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="lease_start" class="form-label">Lease Start Date</label>
                            <input type="date" class="form-control" id="lease_start" name="lease_start" required>
                        </div>
                        <div class="mb-3">
                            <label for="lease_end" class="form-label">Lease End Date</label>
                            <input type="date" class="form-control" id="lease_end" name="lease_end" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Add Tenant</button>
                            <a href="{{ url_for('tenants.list_tenants') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
